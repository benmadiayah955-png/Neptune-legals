<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neptune Legal — Gestion utilisateurs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(199,139,228,.15), transparent 30%),
        radial-gradient(circle at top left, rgba(122,202,237,.12), transparent 30%),
        #0b1020;
    color: white;
    min-height: 100vh;
}

header {
    background: rgba(17,24,45,.96);
    border-bottom: 1px solid #26304d;
    padding: 20px 30px;
}

.header-content {
    max-width: 1250px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

header h1 {
    color: #7ACAED;
    font-size: 27px;
}

header p {
    color: #98CAF7;
    margin-top: 5px;
}

.role-badge {
    padding: 10px 15px;
    border-radius: 10px;
    background: rgba(122,202,237,.10);
    border: 1px solid #7ACAED;
    color: #98CAF7;
    font-weight: bold;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 35px 25px 50px;
}

.back {
    display: inline-block;
    margin-bottom: 25px;
    color: #98CAF7;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    color: #7ACAED;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h2 {
    font-size: 30px;
    color: #7ACAED;
    margin-bottom: 8px;
}

.page-title p {
    color: #98a9c4;
}

.status {
    padding: 14px 18px;
    margin-bottom: 25px;
    border-radius: 12px;
    background: rgba(122,202,237,.08);
    border: 1px solid rgba(122,202,237,.35);
    color: #d8e4f5;
}

.status.error {
    background: rgba(220,70,70,.12);
    border-color: #dc4646;
    color: #ff8585;
}

.status.success {
    background: rgba(80,190,130,.10);
    border-color: rgba(80,190,130,.45);
    color: #8ff0b5;
}

.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 240px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #26304d;
    background: #11182d;
    color: white;
    outline: none;
}

.search:focus {
    border-color: #7ACAED;
}

.refresh {
    padding: 14px 20px;
    border: 1px solid #7ACAED;
    border-radius: 12px;
    background: rgba(122,202,237,.10);
    color: #7ACAED;
    font-weight: bold;
    cursor: pointer;
}

.refresh:hover {
    background: rgba(122,202,237,.20);
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: #11182d;
    border: 1px solid #26304d;
    border-radius: 15px;
    padding: 20px;
}

.stat h3 {
    color: #8fa1bd;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat strong {
    color: #7ACAED;
    font-size: 28px;
}

.users {
    display: grid;
    gap: 16px;
}

.user-card {
    background: linear-gradient(145deg,#11182d,#0e1426);
    border: 1px solid #26304d;
    border-radius: 16px;
    padding: 22px;
}

.user-card:hover {
    border-color: rgba(122,202,237,.55);
}

.user-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-start;
}

.user-info h3 {
    color: #7ACAED;
    font-size: 20px;
    margin-bottom: 5px;
}

.username {
    color: #98a9c4;
    font-size: 14px;
}

.user-details {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 25px;
}

.detail {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
}

.detail .label {
    display: block;
    color: #71819b;
    font-size: 12px;
    margin-bottom: 4px;
}

.detail .value {
    color: #d8e4f5;
    word-break: break-word;
}

.badge {
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.badge.active {
    background: rgba(70,190,120,.12);
    border: 1px solid rgba(70,190,120,.45);
    color: #8ff0b5;
}

.badge.inactive {
    background: rgba(220,70,70,.12);
    border: 1px solid rgba(220,70,70,.45);
    color: #ff8585;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.btn-edit {
    background: rgba(122,202,237,.12);
    border: 1px solid #7ACAED;
    color: #7ACAED;
}

.btn-edit:hover {
    background: rgba(122,202,237,.22);
}

.btn-delete {
    background: rgba(220,70,70,.10);
    border: 1px solid #dc4646;
    color: #ff8585;
}

.btn-delete:hover {
    background: rgba(220,70,70,.20);
}

.empty {
    text-align: center;
    padding: 50px 20px;
    background: #11182d;
    border: 1px solid #26304d;
    border-radius: 16px;
    color: #8fa1bd;
}

.hidden {
    display: none !important;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.70);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal-box {
    width: 100%;
    max-width: 520px;
    background: #11182d;
    border: 1px solid #26304d;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.modal-box h2 {
    color: #7ACAED;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    color: #98a9c4;
    margin-bottom: 7px;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #26304d;
    background: #0b1020;
    color: white;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #7ACAED;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.cancel {
    padding: 11px 17px;
    border-radius: 10px;
    border: 1px solid #26304d;
    background: #0b1020;
    color: #98a9c4;
    cursor: pointer;
}

.save {
    padding: 11px 17px;
    border-radius: 10px;
    border: 1px solid #7ACAED;
    background: rgba(122,202,237,.15);
    color: #7ACAED;
    font-weight: bold;
    cursor: pointer;
}

.save:hover {
    background: rgba(122,202,237,.25);
}

@media (max-width: 700px) {

    .header-content {
        flex-direction: column;
        align-items: flex-start;
    }

    .role-badge {
        width: 100%;
    }

    main {
        padding: 25px 15px 40px;
    }

    .user-top {
        flex-direction: column;
    }

    .user-details {
        grid-template-columns: 1fr;
    }

    .actions {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">

        <div>
            <h1>Neptune Legal</h1>
            <p>Gestion des utilisateurs</p>
        </div>

        <div id="roleBadge" class="role-badge">
            Vérification...
        </div>

    </div>
</header>


<main>

<a href="dashboard.html" class="back">
    ← Retour au dashboard
</a>


<div class="page-title">

    <h2>Gestion des utilisateurs</h2>

    <p>
        Consultez et administrez les comptes utilisateurs de Neptune Legal.
    </p>

</div>


<div id="status" class="status">
    Vérification de vos permissions...
</div>


<section id="content" class="hidden">

    <div class="stats">

        <div class="stat">
            <h3>Utilisateurs</h3>
            <strong id="totalUsers">0</strong>
        </div>

        <div class="stat">
            <h3>Actifs</h3>
            <strong id="activeUsers">0</strong>
        </div>

        <div class="stat">
            <h3>Inactifs</h3>
            <strong id="inactiveUsers">0</strong>
        </div>

    </div>


    <div class="toolbar">

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="Rechercher un utilisateur..."
        >

        <button
            id="refreshButton"
            class="refresh"
            type="button"
        >
            Actualiser
        </button>

    </div>


    <div id="usersContainer" class="users"></div>

</section>

</main>


<!-- MODAL MODIFICATION -->

<div id="editModal" class="modal hidden">

    <div class="modal-box">

        <h2>Modifier l'utilisateur</h2>

        <form id="editForm">

            <div class="form-group">

                <label for="editFullName">
                    Nom complet
                </label>

                <input
                    id="editFullName"
                    type="text"
                    placeholder="Nom complet"
                >

            </div>


            <div class="form-group">

                <label for="editUsername">
                    Username
                </label>

                <input
                    id="editUsername"
                    type="text"
                    placeholder="Username"
                >

            </div>


            <div class="form-group">

                <label for="editStatus">
                    Statut
                </label>

                <select id="editStatus">

                    <option value="actif">
                        Actif
                    </option>

                    <option value="inactif">
                        Inactif
                    </option>

                    <option value="suspendu">
                        Suspendu
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel"
                    id="cancelEdit"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    Enregistrer
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://xzmglqxcsrzivvkpemyt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const FUNCTION_NAME =
"R-les_discord";


let utilisateurs = [];

let utilisateurEnModification = null;


/* =========================
   ELEMENTS
========================= */

const statusElement =
document.getElementById("status");

const contentElement =
document.getElementById("content");

const roleBadge =
document.getElementById("roleBadge");

const usersContainer =
document.getElementById("usersContainer");

const searchInput =
document.getElementById("searchInput");

const refreshButton =
document.getElementById("refreshButton");

const editModal =
document.getElementById("editModal");

const editForm =
document.getElementById("editForm");

const editFullName =
document.getElementById("editFullName");

const editUsername =
document.getElementById("editUsername");

const editStatus =
document.getElementById("editStatus");

const cancelEdit =
document.getElementById("cancelEdit");


/* =========================
   STATUS
========================= */

function afficherErreur(message) {

    statusElement.textContent =
    message;

    statusElement.className =
    "status error";

}


function afficherSucces(message) {

    statusElement.textContent =
    message;

    statusElement.className =
    "status success";

}


function afficherInfo(message) {

    statusElement.textContent =
    message;

    statusElement.className =
    "status";

}


/* =========================
   VERIFICATION ADMIN
========================= */

async function verifierAcces() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {
            throw error;
        }


        const session =
        data.session;


        if (!session) {

            window.location.href =
            "connexion.html";

            return false;
        }


        const user =
        session.user;


        const discordIdentity =
        user.identities?.find(
            identity =>
            identity.provider === "discord"
        );


        const discordUserId =
        discordIdentity?.identity_data?.provider_id ||
        discordIdentity?.identity_data?.sub ||
        user.user_metadata?.provider_id ||
        user.user_metadata?.sub;


        if (!discordUserId) {

            throw new Error(
                "Identifiant Discord introuvable."
            );

        }


        const {
            data: roleData,
            error: functionError
        } =
        await supabaseClient.functions.invoke(
            FUNCTION_NAME,
            {
                body: {
                    discord_user_id:
                    discordUserId
                }
            }
        );


        if (functionError) {
            throw functionError;
        }


        if (!roleData) {

            throw new Error(
                "Aucune réponse du serveur."
            );

        }


        if (roleData.error) {

            throw new Error(
                roleData.error
            );

        }


        const role =
        roleData.role ||
        "Aucun accès";


        roleBadge.textContent =
        role;


        if (
            roleData.member !== true ||
            roleData.full_access !== true
        ) {

            afficherErreur(
                "Accès refusé. Cette page est réservée aux rôles Neptune Legal avec accès complet."
            );

            return false;
        }


        afficherSucces(
            "Accès administrateur autorisé."
        );


        contentElement.classList.remove(
            "hidden"
        );


        return true;

    }

    catch (error) {

        console.error(
            "Erreur permissions :",
            error
        );


        afficherErreur(
            "Impossible de vérifier vos permissions."
        );


        return false;

    }

}


/* =========================
   CHARGER UTILISATEURS
========================= */

async function chargerUtilisateurs() {

    afficherInfo(
        "Chargement des utilisateurs..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Erreur profiles :",
            error
        );


        afficherErreur(
            "Impossible de charger les utilisateurs : " +
            error.message
        );

        return;

    }


    utilisateurs =
    data || [];


    afficherStatistiques();

    afficherUtilisateurs(
        utilisateurs
    );


    afficherInfo(
        utilisateurs.length +
        " utilisateur(s) chargé(s)."
    );

}


/* =========================
   STATISTIQUES
========================= */

function afficherStatistiques() {

    const total =
    utilisateurs.length;


    const actifs =
    utilisateurs.filter(
        utilisateur =>
        utilisateur.status === "actif" ||
        utilisateur.status === "active"
    ).length;


    const inactifs =
    total - actifs;


    document.getElementById(
        "totalUsers"
    ).textContent =
    total;


    document.getElementById(
        "activeUsers"
    ).textContent =
    actifs;


    document.getElementById(
        "inactiveUsers"
    ).textContent =
    inactifs;

}


/* =========================
   AFFICHER UTILISATEURS
========================= */

function afficherUtilisateurs(liste) {

    usersContainer.innerHTML =
    "";


    if (!liste.length) {

        usersContainer.innerHTML = `
            <div class="empty">
                Aucun utilisateur trouvé.
            </div>
        `;

        return;

    }


    liste.forEach(
        utilisateur => {

            const card =
            document.createElement(
                "div"
            );


            card.className =
            "user-card";


            const nom =
            utilisateur.full_name ||
            utilisateur.username ||
            "Utilisateur sans nom";


            const username =
            utilisateur.username
            ? "@" +
              utilisateur.username
            : "Username non renseigné";


            const status =
            utilisateur.status ||
            "actif";


            const statusNormalise =
            String(status)
            .toLowerCase();


            const statusClass =
            statusNormalise === "actif" ||
            statusNormalise === "active"
            ? "active"
            : "inactive";


            const date =
            utilisateur.created_at
            ? new Date(
                utilisateur.created_at
              ).toLocaleDateString(
                "fr-FR"
              )
            : "Non renseignée";


            card.innerHTML = `

                <div class="user-top">

                    <div class="user-info">

                        <h3>
                            ${escapeHtml(nom)}
                        </h3>

                        <div class="username">
                            ${escapeHtml(username)}
                        </div>

                    </div>

                    <div class="badge ${statusClass}">
                        ${escapeHtml(status)}
                    </div>

                </div>


                <div class="user-details">

                    <div class="detail">

                        <span class="label">
                            ID
                        </span>

                        <span class="value">
                            ${escapeHtml(
                                utilisateur.id ||
                                "Non renseigné"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="label">
                            Création
                        </span>

                        <span class="value">
                            ${date}
                        </span>

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="btn btn-edit"
                        type="button"
                        data-edit="${escapeHtml(
                            utilisateur.id
                        )}"
                    >
                        Modifier
                    </button>


                    <button
                        class="btn btn-delete"
                        type="button"
                        data-delete="${escapeHtml(
                            utilisateur.id
                        )}"
                    >
                        Supprimer
                    </button>

                </div>

            `;


            usersContainer.appendChild(
                card
            );

        }
    );


    document
        .querySelectorAll(
            "[data-edit]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        ouvrirModification(
                            button.dataset.edit
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        supprimerUtilisateur(
                            button.dataset.delete
                        );

                    }
                );

            }
        );

}


/* =========================
   MODIFICATION
========================= */

function ouvrirModification(id) {

    const utilisateur =
    utilisateurs.find(
        item =>
        String(item.id) ===
        String(id)
    );


    if (!utilisateur) {

        afficherErreur(
            "Utilisateur introuvable."
        );

        return;

    }


    utilisateurEnModification =
    utilisateur;


    editFullName.value =
    utilisateur.full_name ||
    "";


    editUsername.value =
    utilisateur.username ||
    "";


    editStatus.value =
    utilisateur.status ||
    "actif";


    editModal.classList.remove(
        "hidden"
    );

}


function fermerModification() {

    utilisateurEnModification =
    null;

    editModal.classList.add(
        "hidden"
    );

}


cancelEdit.addEventListener(
    "click",
    fermerModification
);


editModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            editModal
        ) {

            fermerModification();

        }

    }
);


/* =========================
   ENREGISTRER MODIFICATION
========================= */

editForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if (
            !utilisateurEnModification
        ) {

            return;

        }


        const id =
        utilisateurEnModification.id;


        const nouvellesDonnees = {

            full_name:
            editFullName.value.trim(),

            username:
            editUsername.value.trim(),

            status:
            editStatus.value

        };


        afficherInfo(
            "Enregistrement..."
        );


        const {
            error
        } =
        await supabaseClient
            .from("profiles")
            .update(
                nouvellesDonnees
            )
            .eq(
                "id",
                id
            );


        if (error) {

            console.error(
                "Erreur modification :",
                error
            );


            afficherErreur(
                "Impossible de modifier cet utilisateur : " +
                error.message
            );

            return;

        }


        fermerModification();


        afficherSucces(
            "Utilisateur modifié avec succès."
        );


        await chargerUtilisateurs();

    }
);


/* =========================
   SUPPRIMER
========================= */

async function supprimerUtilisateur(id) {

    const utilisateur =
    utilisateurs.find(
        item =>
        String(item.id) ===
        String(id)
    );


    if (!utilisateur) {

        afficherErreur(
            "Utilisateur introuvable."
        );

        return;

    }


    const nom =
    utilisateur.full_name ||
    utilisateur.username ||
    "cet utilisateur";


    const confirmation =
    confirm(
        "Voulez-vous vraiment supprimer " +
        nom +
        " ?\n\nCette action peut être définitive."
    );


    if (!confirmation) {
        return;
    }


    afficherInfo(
        "Suppression en cours..."
    );


    const {
        error
    } =
    await supabaseClient
        .from("profiles")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(
            "Erreur suppression :",
            error
        );


        afficherErreur(
            "Impossible de supprimer cet utilisateur : " +
            error.message
        );

        return;

    }


    afficherSucces(
        "Utilisateur supprimé avec succès."
    );


    await chargerUtilisateurs();

}


/* =========================
   RECHERCHE
========================= */

searchInput.addEventListener(
    "input",
    () => {

        const recherche =
        searchInput.value
            .toLowerCase()
            .trim();


        if (!recherche) {

            afficherUtilisateurs(
                utilisateurs
            );

            return;

        }


        const resultat =
        utilisateurs.filter(
            utilisateur => {

                const nom =
                String(
                    utilisateur.full_name ||
                    ""
                ).toLowerCase();


                const username =
                String(
                    utilisateur.username ||
                    ""
                ).toLowerCase();


                const id =
                String(
                    utilisateur.id ||
                    ""
                ).toLowerCase();


                return (
                    nom.includes(
                        recherche
                    ) ||
                    username.includes(
                        recherche
                    ) ||
                    id.includes(
                        recherche
                    )
                );

            }
        );


        afficherUtilisateurs(
            resultat
        );

    }
);


/* =========================

/* =========================
   SECURITE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   DEMARRAGE
========================= */

async function demarrer() {

    const acces =
    await verifierAcces();


    if (!acces) {
        return;
    }


    await chargerUtilisateurs();

}


demarrer();
