<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neptune — Gestion des employés</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top right,
            rgba(199,139,228,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at top left,
            rgba(122,202,237,.12),
            transparent 30%
        ),
        #0b1020;

    color: #ffffff;
}

header {
    background: rgba(17,24,45,.96);
    padding: 17px 20px;
    border-bottom: 1px solid #26304d;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: 800;

    background: linear-gradient(
        90deg,
        #7ACAED,
        #58A3DD,
        #C78BE4,
        #D1A6F1
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.back {
    color: #7ACAED;
    text-decoration: none;
    font-weight: bold;
    transition: .2s;
}

.back:hover {
    color: #D1A6F1;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 28px 18px 50px;
}

h1 {
    font-size: 29px;
    margin-bottom: 7px;
}

.subtitle {
    color: #9aa8c2;
    margin-bottom: 25px;
    line-height: 1.5;
}

.add {
    width: 100%;
    border: 1px solid rgba(122,202,237,.25);

    padding: 15px;
    border-radius: 14px;
    margin-bottom: 20px;

    color: white;
    font-weight: bold;
    font-size: 15px;

    background: linear-gradient(
        90deg,
        #58A3DD,
        #7ACAED,
        #C78BE4,
        #D1A6F1
    );

    cursor: pointer;
    transition: .2s;
}

.add:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(88,163,221,.18);
}

.employee {
    background: linear-gradient(
        145deg,
        #11182d,
        #0e1426
    );

    border: 1px solid #26304d;
    border-radius: 20px;

    padding: 20px;
    margin-bottom: 14px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);
}

.top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
}

.avatar {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    background: linear-gradient(
        135deg,
        #7ACAED,
        #58A3DD,
        #C78BE4
    );

    color: white;
}

.name {
    font-weight: bold;
    font-size: 17px;
}

.discord {
    color: #7f8da8;
    font-size: 12px;
    margin-top: 4px;
}

.grade {
    display: inline-block;

    margin-top: 6px;

    padding: 5px 9px;

    border-radius: 20px;

    background: rgba(122,202,237,.12);

    border: 1px solid rgba(122,202,237,.18);

    color: #7ACAED;

    font-size: 11px;

    font-weight: bold;
}

.infos {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

    gap: 12px;
}

.info {
    background: #0b1020;

    border: 1px solid #26304d;

    border-radius: 12px;

    padding: 13px;
}

.info-label {
    color: #7f8da8;
    font-size: 11px;
    margin-bottom: 5px;
}

.info-value {
    color: #ffffff;
    font-weight: bold;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 17px;
    flex-wrap: wrap;
}

.action {
    border: none;

    padding: 10px 14px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;
    font-size: 13px;

    transition: .2s;
}

.action:hover {
    transform: translateY(-2px);
}

.primary {
    background: rgba(88,163,221,.14);

    border: 1px solid rgba(88,163,221,.25);

    color: #7ACAED;
}

.danger {
    background: rgba(224,82,82,.10);

    border: 1px solid rgba(224,82,82,.20);

    color: #ff7777;
}

.empty {
    background: linear-gradient(
        145deg,
        #11182d,
        #0e1426
    );

    border: 1px dashed #26304d;

    border-radius: 18px;

    padding: 35px 20px;

    text-align: center;

    color: #9aa8c2;
}

@media (max-width: 600px) {

    header {
        gap: 12px;
    }

    .logo {
        font-size: 18px;
    }

    .back {
        font-size: 13px;
    }

    h1 {
        font-size: 25px;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        Neptune Legal
    </div>

    <a href="entreprises.html" class="back">
        Retour aux entreprises
    </a>

</header>

<div class="container">

    <h1>
        Gestion des employés
    </h1>

    <p class="subtitle">
        Gérez les employés, leurs grades et leur évolution au sein de votre entreprise.
    </p>

    <button
        class="add"
        type="button"
        onclick="ajouterEmploye()"
    >
        Ajouter un employé
    </button>

    <div id="listeEmployes">

        <div class="employee">

            <div class="top">

                <div class="avatar">
                    N
                </div>

                <div>

                    <div class="name">
                        Neptune Legal
                    </div>

                    <div class="discord">
                        Aucun employé enregistré
                    </div>

                    <span class="grade">
                        Exemple
                    </span>

                </div>

            </div>

            <div class="infos">

                <div class="info">

                    <div class="info-label">
                        Grade
                    </div>

                    <div class="info-value">
                        Aucun
                    </div>

                </div>

                <div class="info">

                    <div class="info-label">
                        Heures
                    </div>

                    <div class="info-value">
                        0 h
                    </div>

                </div>

                <div class="info">

                    <div class="info-label">
                        Statut
                    </div>

                    <div class="info-value">
                        Aucun employé
                    </div>

                </div>

            </div>

            <div class="actions">

                <button
                    class="action primary"
                    type="button"
                    onclick="voirEmploye()"
                >
                    Voir le profil
                </button>

            </div>

        </div>

    </div>

</div>

<script>

function ajouterEmploye() {

    alert(
        "La gestion des employés sera connectée à Supabase dans la prochaine étape."
    );

}

function voirEmploye() {

    alert(
        "Aucun employé réel n'est encore enregistré."
    );

}

</script>

</body>
</html>
