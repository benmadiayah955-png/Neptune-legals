<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatures — Neptune Legal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(199, 139, 228, 0.25), transparent 35%),
                radial-gradient(circle at bottom left, rgba(122, 202, 237, 0.20), transparent 35%),
                #0b1020;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(15px);
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
            background: linear-gradient(
                90deg,
                #7ACAED,
                #58A3DD,
                #98CAF7,
                #C78BE4,
                #D1A6F1
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #b9c0d0;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e8ecf5;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: white;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #7ACAED;
            box-shadow: 0 0 0 3px rgba(122, 202, 237, 0.12);
        }

        select option {
            background: #151a2d;
            color: white;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 11px;
        }

        .help {
            margin-top: 7px;
            color: #9299aa;
            font-size: 13px;
        }

        .button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(
                90deg,
                #58A3DD,
                #7ACAED,
                #C78BE4
            );
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(122, 202, 237, 0.25);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
        }

        .success {
            display: block;
            background: rgba(60, 200, 120, 0.15);
            border: 1px solid rgba(60, 200, 120, 0.35);
            color: #8df0b5;
        }

        .error {
            display: block;
            background: rgba(255, 80, 100, 0.15);
            border: 1px solid rgba(255, 80, 100, 0.35);
            color: #ff9aa8;
        }

        .loading {
            text-align: center;
            color: #b9c0d0;
            padding: 15px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #98CAF7;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="dashboard.html" class="back">
        ← Retour au dashboard
    </a>

    <div class="header">
        <h1>Déposer une candidature</h1>
        <p>
            Remplissez le formulaire afin de rejoindre une entreprise sur Neptune Legal.
        </p>
    </div>

    <div class="card">

        <form id="candidatureForm">

            <div class="form-group">
                <label for="entreprise">
                    Entreprise
                </label>

                <select id="entreprise" required>
                    <option value="">
                        Chargement des entreprises...
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="nom">
                    Nom / Prénom
                </label>

                <input
                    type="text"
                    id="nom"
                    placeholder="Votre nom et prénom"
                    required
                >
            </div>

            <div class="form-group">
                <label for="motivation">
                    Motivation
                </label>

                <textarea
                    id="motivation"
                    placeholder="Expliquez votre motivation..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="document">
                    Document
                </label>

                <input
                    type="file"
                    id="document"
                >

                <div class="help">
                    Les pièces jointes seront ajoutées ultérieurement.
                </div>
            </div>

            <button
                type="submit"
                class="button"
                id="submitButton"
            >
                Envoyer ma candidature
            </button>

            <div id="message" class="message"></div>

        </form>

    </div>

</div>

<script>
    const SUPABASE_URL = "https://xzmglqxcsrzivvkpemyt.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const form =
        document.getElementById("candidatureForm");

    const entrepriseSelect =
        document.getElementById("entreprise");

    const nomInput =
        document.getElementById("nom");

    const motivationInput =
        document.getElementById("motivation");

    const submitButton =
        document.getElementById("submitButton");

    const message =
        document.getElementById("message");


    function afficherMessage(texte, type) {

        message.textContent = texte;

        message.className =
            "message " + type;
    }


    async function verifierConnexion() {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if (error || !data.user) {

            afficherMessage(
                "Vous devez être connecté pour déposer une candidature.",
                "error"
            );

            submitButton.disabled = true;

            return false;
        }

        return true;
    }


    async function chargerEntreprises() {

        entrepriseSelect.innerHTML =
            '<option value="">Chargement des entreprises...</option>';

        const {
            data,
            error
        } = await supabaseClient
            .from("Entreprises")
            .select("id, Nom")
            .order("Nom", {
                ascending: true
            });


        if (error) {

            console.error(
                "Erreur entreprises :",
                error
            );

            entrepriseSelect.innerHTML =
                '<option value="">Erreur de chargement</option>';

            afficherMessage(
                "Impossible de charger les entreprises : " +
                error.message,
                "error"
            );

            return;
        }


        entrepriseSelect.innerHTML =
            '<option value="">Sélectionnez une entreprise</option>';


        if (!data || data.length === 0) {

            entrepriseSelect.innerHTML =
                '<option value="">Aucune entreprise disponible</option>';

            return;
        }


        data.forEach(entreprise => {

            const option =
                document.createElement("option");

            option.value =
                entreprise.id;

            option.textContent =
                entreprise.Nom;

            entrepriseSelect.appendChild(option);

        });
    }


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            const entrepriseId =
                entrepriseSelect.value;

            const nom =
                nomInput.value.trim();

            const motivation =
                motivationInput.value.trim();


            if (!entrepriseId) {

                afficherMessage(
                    "Veuillez sélectionner une entreprise.",
                    "error"
                );

                return;
            }


            if (!nom) {

                afficherMessage(
                    "Veuillez renseigner votre nom.",
                    "error"
                );

                return;
            }


            if (!motivation) {

                afficherMessage(
                    "Veuillez renseigner votre motivation.",
                    "error"
                );

                return;
            }


            submitButton.disabled = true;

            submitButton.textContent =
                "Envoi en cours...";


            const connected =
                await verifierConnexion();


            if (!connected) {

                submitButton.disabled = false;

                submitButton.textContent =
                    "Envoyer ma candidature";

                return;
            }


            /*
             * IMPORTANT :
             * La colonne "document" n'existe pas
             * actuellement dans la table candidatures.
             *
             * Elle n'est donc PAS envoyée à Supabase.
             */

            const {
                error
            } = await supabaseClient
                .from("candidatures")
                .insert({

                    entreprise_id:
                        entrepriseId,

                    nom:
                        nom,

                    motivation:
                        motivation,

                    statut:
                        "en_attente"
                });


            if (error) {

                console.error(
                    "Erreur candidature :",
                    error
                );

                afficherMessage(
                    "Impossible d'envoyer la candidature : " +
                    error.message,
                    "error"
                );

                submitButton.disabled = false;

                submitButton.textContent =
                    "Envoyer ma candidature";

                return;
            }


            afficherMessage(
                "Votre candidature a été envoyée avec succès.",
                "success"
            );


            form.reset();

            await chargerEntreprises();


            submitButton.disabled = false;

            submitButton.textContent =
                "Envoyer ma candidature";

        }
    );


    async function initialiser() {

        const connected =
            await verifierConnexion();

        if (!connected) {
            return;
        }

        await chargerEntreprises();
    }


    initialiser();
</script>

</body>
</html>
