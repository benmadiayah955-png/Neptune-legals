<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neptune Legal — Candidatures</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bleu: #7ACAED;
            --bleu-fonce: #58A3DD;
            --bleu-clair: #98CAF7;
            --violet: #C78BE4;
            --violet-clair: #D1A6F1;

            --fond: #f7fbff;
            --texte: #172033;
            --secondaire: #788296;
            --bordure: #e2e8f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--fond);
            color: var(--texte);
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 25px;
            border-bottom: 1px solid var(--bordure);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    var(--bleu),
                    var(--bleu-fonce),
                    var(--violet),
                    var(--violet-clair)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .back {
            color: var(--bleu-fonce);
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: var(--violet);
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--secondaire);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form {
            background: white;
            border: 1px solid var(--bordure);
            border-radius: 20px;
            padding: 28px;

            box-shadow:
                0 10px 35px rgba(50, 70, 100, 0.07);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;

            border: 1px solid #dce3ee;
            border-radius: 12px;

            outline: none;
            font-size: 14px;

            background: #fbfcff;
            color: var(--texte);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--bleu-fonce);
            box-shadow:
                0 0 0 3px rgba(88, 163, 221, 0.12);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .file {
            background: #f7faff;
        }

        .help {
            color: var(--secondaire);
            font-size: 12px;
            margin-top: 6px;
        }

        .submit {
            width: 100%;
            border: none;

            padding: 15px;
            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    var(--bleu-fonce),
                    var(--violet)
                );

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .submit:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;
            padding: 15px;

            border-radius: 12px;

            text-align: center;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eafaf0;
            color: #16733c;
            border: 1px solid #bce8ca;
        }

        .message.error {
            display: block;
            background: #fff0f2;
            color: #a52c40;
            border: 1px solid #f0bcc5;
        }

        .message.info {
            display: block;
            background: #eef7ff;
            color: #24618c;
            border: 1px solid #c9e5f8;
        }

        .account {
            margin-bottom: 20px;
            padding: 13px 15px;

            background:
                linear-gradient(
                    90deg,
                    rgba(122, 202, 237, 0.10),
                    rgba(199, 139, 228, 0.10)
                );

            border: 1px solid var(--bordure);
            border-radius: 12px;

            color: var(--secondaire);
            font-size: 13px;
        }

        .account strong {
            color: var(--texte);
        }

        @media (max-width: 650px) {
            header {
                padding: 16px;
            }

            .container {
                padding: 25px 15px 45px;
            }

            .form {
                padding: 20px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Neptune Legal
    </div>

    <a
        href="entreprises.html"
        class="back"
    >
        Retour aux entreprises
    </a>

</header>


<div class="container">

    <h1>
        Déposer une candidature
    </h1>

    <p class="subtitle">
        Remplissez ce formulaire pour déposer votre candidature
        auprès d'une entreprise.
    </p>


    <div class="form">

        <div
            class="account"
            id="accountInfo"
        >
            Vérification de votre compte...
        </div>


        <div class="field">

            <label for="entreprise">
                Entreprise
            </label>

            <select id="entreprise">

                <option value="">
                    Chargement des entreprises...
                </option>

            </select>

        </div>


        <div class="field">

            <label for="nom">
                Nom
            </label>

            <input
                type="text"
                id="nom"
                placeholder="Votre nom"
            >

        </div>


        <div class="field">

            <label for="motivation">
                Motivation
            </label>

            <textarea
                id="motivation"
                placeholder="Expliquez votre motivation..."
            ></textarea>

        </div>


        <div class="field">

            <label for="document">
                Document complémentaire
            </label>

            <input
                class="file"
                type="file"
                id="document"
            >

            <div class="help">
                Le document sera enregistré comme pièce jointe
                dans votre candidature.
            </div>

        </div>


        <button
            class="submit"
            type="button"
            id="submitBtn"
        >
            Déposer ma candidature
        </button>


        <div
            class="message"
            id="message"
        ></div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://xzmglqxcsrzivvkpemyt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let utilisateurActuel = null;


/* ================================
   MESSAGE
================================ */

function afficherMessage(
    texte,
    type
) {

    const message =
        document.getElementById("message");

    message.textContent = texte;

    message.className =
        "message " + type;
}


/* ================================
   CHARGEMENT DE L'UTILISATEUR
================================ */

async function chargerUtilisateur() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href =
            "connexion.html";

        return false;
    }


    utilisateurActuel = user;


    const nomDiscord =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.user_metadata?.preferred_username ||
        "";


    document.getElementById("nom").value =
        nomDiscord;


    document.getElementById("accountInfo").innerHTML =
        `
            Connecté en tant que
            <strong>
                ${escapeHTML(
                    nomDiscord ||
                    user.email ||
                    "Utilisateur"
                )}
            </strong>
        `;


    return true;
}


/* ================================
   CHARGEMENT DES ENTREPRISES
================================ */

async function chargerEntreprises() {

    const select =
        document.getElementById("entreprise");


    const {
        data,
        error
    } =
        await supabaseClient
            .from("entreprises")
            .select("id, nom")
            .order("nom", {
                ascending: true
            });


    if (error) {

        console.error(error);

        select.innerHTML =
            `
                <option value="">
                    Impossible de charger les entreprises
                </option>
            `;

        return;
    }


    if (!data || data.length === 0) {

        select.innerHTML =
            `
                <option value="">
                    Aucune entreprise disponible
                </option>
            `;

        return;
    }


    select.innerHTML =
        `
            <option value="">
                Sélectionner une entreprise
            </option>
        `;


    data.forEach(
        function(entreprise) {

            const option =
                document.createElement("option");


            option.value =
                entreprise.id;


            option.textContent =
                entreprise.nom;


            select.appendChild(option);

        }
    );
}


/* ================================
   ENVOI DE LA CANDIDATURE
================================ */

async function envoyerCandidature() {

    const bouton =
        document.getElementById("submitBtn");


    const entrepriseId =
        document.getElementById(
            "entreprise"
        ).value;


    const nom =
        document.getElementById(
            "nom"
        ).value.trim();


    const motivation =
        document.getElementById(
            "motivation"
        ).value.trim();


    const fichier =
        document.getElementById(
            "document"
        ).files[0];


    if (!utilisateurActuel) {

        afficherMessage(
            "Votre session a expiré. Reconnectez-vous.",
            "error"
        );

        return;
    }


    if (!entrepriseId) {

        afficherMessage(
            "Sélectionnez une entreprise.",
            "error"
        );

        return;
    }


    if (!nom) {

        afficherMessage(
            "Indiquez votre nom.",
            "error"
        );

        return;
    }


    if (!motivation) {

        afficherMessage(
            "Indiquez votre motivation.",
            "error"
        );

        return;
    }


    bouton.disabled = true;

    bouton.textContent =
        "Envoi en cours...";


    afficherMessage(
        "Enregistrement de votre candidature...",
        "info"
    );


    /*
       Pour le moment, on enregistre
       le nom du fichier.

       Le vrai stockage de fichier dans
       Supabase Storage pourra être ajouté
       ensuite.
    */

    const documentNom =
        fichier
            ? fichier.name
            : null;


    const {
        error
    } =
        await supabaseClient
            .from("candidatures")
            .insert({

                entreprise_id:
                    entrepriseId,

                nom:
                    nom,

                motivation:
                    motivation,

                document:
                    documentNom,

                statut:
                    "en_attente"

            });


    if (error) {

        console.error(
            "Erreur candidature :",
            error
        );


        afficherMessage(
            "Impossible d'envoyer la candidature : " +
            error.message,
            "error"
        );


        bouton.disabled = false;

        bouton.textContent =
            "Déposer ma candidature";

        return;
    }


    afficherMessage(
        "Votre candidature a bien été envoyée. Elle est maintenant en attente de traitement par le Staff.",
        "success"
    );


    document.getElementById(
        "entreprise"
    ).value = "";


    document.getElementById(
        "motivation"
    ).value = "";


    document.getElementById(
        "document"
    ).value = "";


    bouton.disabled = false;

    bouton.textContent =
        "Déposer ma candidature";
}


/* ================================
   PROTECTION HTML
================================ */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* ================================
   INITIALISATION
================================ */

async function initialiser() {

    const connecte =
        await chargerUtilisateur();


    if (!connecte) {
        return;
    }


    await chargerEntreprises();


    document
        .getElementById("submitBtn")
        .addEventListener(
            "click",
            envoyerCandidature
        );
}


initialiser();

</script>

</body>
</html>
