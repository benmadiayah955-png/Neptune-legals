<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neptune — Candidatures</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f7fbff;
    color: #172033;
}

header {
    background: white;
    padding: 18px 20px;
    border-bottom: 1px solid #e5e9f5;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    background: linear-gradient(90deg, #00cfff, #5865f2, #a855f7, #ec4899);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.back {
    color: #5865f2;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px 20px 50px;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #788296;
    margin-bottom: 25px;
    line-height: 1.6;
}

.form {
    background: white;
    border: 1px solid #e6eaf4;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(50,70,100,.06);
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
}

input,
select,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #dfe4ef;
    border-radius: 12px;
    margin-bottom: 18px;
    outline: none;
    font-size: 14px;
    background: #fbfcff;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.file {
    background: #f5f7ff;
    padding: 15px;
}

.submit {
    width: 100%;
    border: none;
    padding: 15px;
    border-radius: 13px;
    color: white;
    background: linear-gradient(90deg, #5865f2, #8b5cf6);
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.submit:hover {
    opacity: 0.9;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    background: #eef2ff;
    color: #3949ab;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <div class="logo">Neptune Legal</div>

    <a href="entreprises.html" class="back">
        Retour aux entreprises
    </a>
</header>

<div class="container">

    <h1>Déposer une candidature</h1>

    <p class="subtitle">
        Remplissez ce formulaire pour déposer votre candidature auprès d'une entreprise.
    </p>

    <div class="form">

        <label for="entreprise">Entreprise</label>

        <select id="entreprise">
            <option value="">Chargement...</option>
        </select>

        <label for="nom">Nom</label>

        <input
            type="text"
            id="nom"
            placeholder="Votre nom"
        >

        <label for="motivation">Motivation</label>

        <textarea
            id="motivation"
            placeholder="Expliquez votre motivation..."
        ></textarea>

        <label for="document">Document complémentaire</label>

        <input
            class="file"
            type="file"
            id="document"
        >

        <button
            class="submit"
            type="button"
            id="submitBtn"
        >
            Déposer ma candidature
        </button>

        <div class="message" id="message"></div>

    </div>

</div>

<script>
const SUPABASE_URL = "https://xzmglqxcsrzivvkpemyt.supabase.co";
const SUPABASE_KEY = "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

const script = document.createElement("script");

script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

script.onload = async function() {

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "connexion.html";
        return;
    }

    document.getElementById("nom").value =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "";

    const select = document.getElementById("entreprise");

    const { data, error } = await supabaseClient
        .from("entreprises")
        .select("id, nom")
        .order("nom", { ascending: true });

    if (error) {

        console.error(error);

        select.innerHTML = `
            <option value="">
                Impossible de charger les entreprises
            </option>
        `;

    } else if (!data || data.length === 0) {

        select.innerHTML = `
            <option value="">
                Aucune entreprise disponible
            </option>
        `;

    } else {

        select.innerHTML = `
            <option value="">
                Sélectionner une entreprise
            </option>
        `;

        data.forEach(function(entreprise) {

            const option = document.createElement("option");

            option.value = entreprise.id;
            option.textContent = entreprise.nom;

            select.appendChild(option);
        });
    }

    document.getElementById("submitBtn").addEventListener(
        "click",
        function() {

            const entreprise =
                document.getElementById("entreprise").value;

            const nom =
                document.getElementById("nom").value.trim();

            const motivation =
                document.getElementById("motivation").value.trim();

            const message =
                document.getElementById("message");

            if (!entreprise) {
                message.textContent =
                    "Sélectionnez une entreprise.";
                message.style.display = "block";
                return;
            }

            if (!nom) {
                message.textContent =
                    "Indiquez votre nom.";
                message.style.display = "block";
                return;
            }

            if (!motivation) {
                message.textContent =
                    "Indiquez votre motivation.";
                message.style.display = "block";
                return;
            }

            message.textContent =
                "Votre candidature est prête à être envoyée.";
            message.style.display = "block";
        }
    );
};

document.head.appendChild(script);
</script>

</body>
</html>
