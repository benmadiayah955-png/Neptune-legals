<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neptune Legal — Stock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #111827;
    color: white;
    padding: 18px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: bold;
}

.logo img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.back {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #667085;
    margin-bottom: 25px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.stat strong {
    display: block;
    font-size: 28px;
    margin-top: 8px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #111827;
    color: white;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.product {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.product h3 {
    margin-top: 0;
}

.quantity {
    font-size: 28px;
    font-weight: bold;
    margin: 15px 0;
}

.low {
    color: #b45309;
}

.product-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.product-actions button {
    flex: 1;
}

.empty {
    background: white;
    padding: 35px;
    text-align: center;
    border-radius: 15px;
    color: #667085;
    grid-column: 1 / -1;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 20px;
    border-radius: 12px;
    grid-column: 1 / -1;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 18px;
    padding: 25px;
}

.modal-box input,
.modal-box textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.modal-actions {
    display: flex;
    gap: 10px;
}

@media (max-width: 800px) {
    .stats,
    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="Neptune Legal">
        <span>Neptune Legal</span>
    </div>

    <a href="entreprise-dashboard.html" class="back">
        Retour au tableau de bord
    </a>
</header>

<div class="container">

    <h1>Stock</h1>

    <p class="subtitle">
        Gérez les produits et les quantités de votre entreprise.
    </p>

    <div class="stats">

        <div class="stat">
            Produits
            <strong id="totalProduits">0</strong>
        </div>

        <div class="stat">
            Quantité totale
            <strong id="quantiteTotale">0</strong>
        </div>

        <div class="stat">
            Stocks faibles
            <strong id="stocksFaibles">0</strong>
        </div>

        <div class="stat">
            Valeur du stock
            <strong id="valeurStock">0 €</strong>
        </div>

    </div>

    <div class="actions">

        <button class="primary" onclick="ouvrirModal()">
            Ajouter un produit
        </button>

    </div>

    <input
        id="recherche"
        class="search"
        type="text"
        placeholder="Rechercher un produit..."
        oninput="afficherProduits()"
    >

    <div id="products" class="products">

        <div class="empty">
            Chargement...
        </div>

    </div>

</div>


<!-- MODAL AJOUT PRODUIT -->

<div id="modal" class="modal">

    <div class="modal-box">

        <h2>Ajouter un produit</h2>

        <label>Nom du produit</label>

        <input
            id="nom"
            type="text"
            placeholder="Ex : Eau"
        >

        <label>Description</label>

        <textarea
            id="description"
            placeholder="Description du produit"
        ></textarea>

        <label>Quantité</label>

        <input
            id="quantite"
            type="number"
            value="0"
            min="0"
        >

        <label>Seuil d'alerte</label>

        <input
            id="seuil"
            type="number"
            value="5"
            min="0"
        >

        <label>Prix unitaire</label>

        <input
            id="prix"
            type="number"
            value="0"
            min="0"
            step="0.01"
        >

        <div class="modal-actions">

            <button
                class="primary"
                onclick="ajouterProduit()"
            >
                Ajouter
            </button>

            <button onclick="fermerModal()">
                Annuler
            </button>

        </div>

    </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://xzmglqxcsrzivvkpemyt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let produits = [];


/* ==========================================
   VERIFIER LA CONNEXION
========================================== */

async function verifierConnexion() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error) {

        console.error(
            "Erreur authentification :",
            error
        );

        return null;
    }

    return user;
}


/* ==========================================
   CHARGER LES PRODUITS
========================================== */

async function chargerProduits() {

    const {
        data,
        error
    } = await supabaseClient
        .from("stocks")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(
            "Erreur chargement stocks :",
            error
        );

        document.getElementById(
            "products"
        ).innerHTML = `
            <div class="error">
                <strong>Impossible de charger le stock.</strong>
                <br><br>
                ${echapper(error.message)}
            </div>
        `;

        return;
    }

    produits = data || [];

    afficherProduits();
}


/* ==========================================
   AFFICHER LES PRODUITS
========================================== */

function afficherProduits() {

    const recherche =
        document
            .getElementById("recherche")
            .value
            .toLowerCase();

    const liste =
        produits.filter(
            produit =>
                (produit.nom || "")
                    .toLowerCase()
                    .includes(recherche)
        );

    const container =
        document.getElementById(
            "products"
        );


    if (liste.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Aucun produit dans le stock.
            </div>
        `;

    } else {

        container.innerHTML =
            liste.map(
                produit => {

                    const quantite =
                        Number(
                            produit.quantite || 0
                        );

                    const seuil =
                        Number(
                            produit.seuil_alerte || 0
                        );

                    const prix =
                        Number(
                            produit.prix_unitaire || 0
                        );

                    const faible =
                        quantite <= seuil;


                    return `
                        <div class="product">

                            <h3>
                                ${echapper(
                                    produit.nom
                                )}
                            </h3>

                            <p>
                                ${echapper(
                                    produit.description || ""
                                )}
                            </p>

                            <div class="quantity ${
                                faible ? "low" : ""
                            }">
                                ${quantite}
                            </div>

                            <p>
                                Prix unitaire :
                                ${prix.toFixed(2)} €
                            </p>

                            ${
                                faible
                                ?
                                `
                                <p class="low">
                                    Stock faible
                                </p>
                                `
                                :
                                ""
                            }

                            <div class="product-actions">

                                <button
                                    onclick="
                                        modifierQuantite(
                                            '${produit.id}',
                                            1
                                        )
                                    "
                                >
                                    +1
                                </button>

                                <button
                                    onclick="
                                        modifierQuantite(
                                            '${produit.id}',
                                            -1
                                        )
                                    "
                                >
                                    -1
                                </button>

                                <button
                                    class="danger"
                                    onclick="
                                        supprimerProduit(
                                            '${produit.id}'
                                        )
                                    "
                                >
                                    Supprimer
                                </button>

                            </div>

                        </div>
                    `;
                }
            ).join("");
    }

    mettreAJourStats();
}


/* ==========================================
   STATISTIQUES
========================================== */

function mettreAJourStats() {

    const total =
        produits.length;

    const quantite =
        produits.reduce(
            (
                somme,
                produit
            ) =>
                somme +
                Number(
                    produit.quantite || 0
                ),
            0
        );

    const faibles =
        produits.filter(
            produit =>
                Number(
                    produit.quantite || 0
                )
                <=
                Number(
                    produit.seuil_alerte || 0
                )
        ).length;

    const valeur =
        produits.reduce(
            (
                somme,
                produit
            ) =>
                somme +
                (
                    Number(
                        produit.quantite || 0
                    )
                    *
                    Number(
                        produit.prix_unitaire || 0
                    )
                ),
            0
        );


    document.getElementById(
        "totalProduits"
    ).textContent =
        total;


    document.getElementById(
        "quantiteTotale"
    ).textContent =
        quantite;


    document.getElementById(
        "stocksFaibles"
    ).textContent =
        faibles;


    document.getElementById(
        "valeurStock"
    ).textContent =
        valeur.toFixed(2) + " €";
}


/* ==========================================
   AJOUTER UN PRODUIT
========================================== */

async function ajouterProduit() {

    /* Vérifier la connexion */

    const user =
        await verifierConnexion();


    if (!user) {

        alert(
            "Tu dois être connecté avec Discord pour ajouter un produit."
        );

        window.location.href =
            "connexion.html";

        return;
    }


    /* Récupérer les champs */

    const nom =
        document
            .getElementById("nom")
            .value
            .trim();


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    const quantite =
        Number(
            document
                .getElementById("quantite")
                .value
        );


    const seuil =
        Number(
            document
                .getElementById("seuil")
                .value
        );


    const prix =
        Number(
            document
                .getElementById("prix")
                .value
        );


    /* Vérifications */

    if (!nom) {

        alert(
            "Veuillez entrer le nom du produit."
        );

        return;
    }


    if (
        quantite < 0 ||
        seuil < 0 ||
        prix < 0
    ) {

        alert(
            "Les valeurs ne peuvent pas être négatives."
        );

        return;
    }


    /* Insérer dans Supabase */

    const {
        data,
        error
    } = await supabaseClient
        .from("stocks")
        .insert({

            nom: nom,

            description:
                description || null,

            quantite:
                quantite,

            seuil_alerte:
                seuil,

            prix_unitaire:
                prix,

            entreprise_id:
                null

        })
        .select()
        .single();


    /* Gestion de l'erreur */

    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        alert(
            "Erreur lors de l'ajout du produit :\n\n"
            +
            error.message
            +
            "\n\nCode : "
            +
            (error.code || "inconnu")
        );

        return;
    }


    console.log(
        "Produit ajouté :",
        data
    );


    /* Fermer la fenêtre */

    fermerModal();


    /* Réinitialiser les champs */

    document.getElementById(
        "nom"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "quantite"
    ).value = 0;


    document.getElementById(
        "seuil"
    ).value = 5;


    document.getElementById(
        "prix"
    ).value = 0;


    /* Recharger le stock */

    await chargerProduits();
}


/* ==========================================
   MODIFIER LA QUANTITE
========================================== */

async function modifierQuantite(
    id,
    variation
) {

    const produit =
        produits.find(
            p => p.id === id
        );


    if (!produit) {
        return;
    }


    const nouvelleQuantite =
        Math.max(
            0,
            Number(
                produit.quantite || 0
            )
            +
            variation
        );


    const {
        error
    } = await supabaseClient
        .from("stocks")
        .update({

            quantite:
                nouvelleQuantite

        })
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(
            "Erreur modification :",
            error
        );

        alert(
            "Impossible de modifier la quantité :\n\n"
            +
            error.message
        );

        return;
    }


    await chargerProduits();
}


/* ==========================================
   SUPPRIMER
========================================== */

async function supprimerProduit(
    id
) {

    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer ce produit ?"
        );


    if (!confirmation) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("stocks")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(
            "Erreur suppression :",
            error
        );

        alert(
            "Impossible de supprimer le produit :\n\n"
            +
            error.message
        );

        return;
    }


    await chargerProduits();
}


/* ==========================================
   MODAL
========================================== */

function ouvrirModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "flex";
}


function fermerModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";
}


/* ==========================================
   PROTECTION AFFICHAGE
========================================== */

function echapper(
    texte
) {

    return String(
        texte
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


/* ==========================================
   DEMARRAGE
========================================== */

chargerProduits();

</script>

</body>
</html>
