<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptune Legal — Stocks</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07111f, #101a30, #1b1328);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(122, 202, 237, 0.25);
            background: rgba(9, 22, 37, 0.85);
            backdrop-filter: blur(12px);
        }

        header h1 {
            margin: 0;
            font-size: 25px;
            background: linear-gradient(
                90deg,
                #7ACAED,
                #58A3DD,
                #98CAF7,
                #C78BE4,
                #D1A6F1
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin: 6px 0 0;
            color: #98CAF7;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #7ACAED;
            text-decoration: none;
            transition: 0.2s;
        }

        .back:hover {
            color: #D1A6F1;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top h2 {
            margin: 0;
            font-size: 28px;
        }

        .top p {
            color: #98CAF7;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .primary {
            background: linear-gradient(
                135deg,
                #58A3DD,
                #7ACAED,
                #98CAF7
            );
            box-shadow: 0 5px 20px rgba(88, 163, 221, 0.25);
        }

        .danger {
            background: linear-gradient(
                135deg,
                #C78BE4,
                #D1A6F1
            );
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(12, 27, 44, 0.85);
            border: 1px solid rgba(122, 202, 237, 0.25);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        }

        .stat span {
            display: block;
            color: #98CAF7;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 25px;
            background: linear-gradient(
                90deg,
                #7ACAED,
                #98CAF7,
                #D1A6F1
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(122, 202, 237, 0.3);
            background: rgba(9, 22, 37, 0.9);
            color: white;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #7ACAED;
            box-shadow: 0 0 0 2px rgba(122, 202, 237, 0.1);
        }

        input::placeholder,
        textarea::placeholder {
            color: #7890aa;
        }

        select {
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(122, 202, 237, 0.3);
            background: rgba(9, 22, 37, 0.9);
            color: white;
            outline: none;
        }

        .toolbar input {
            flex: 1;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .product {
            background: rgba(12, 27, 44, 0.88);
            border: 1px solid rgba(122, 202, 237, 0.22);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
            transition: 0.2s;
        }

        .product:hover {
            transform: translateY(-3px);
            border-color: rgba(199, 139, 228, 0.55);
            box-shadow:
                0 10px 35px rgba(88, 163, 221, 0.12),
                0 0 20px rgba(199, 139, 228, 0.06);
        }

        .product h3 {
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(
                90deg,
                #7ACAED,
                #98CAF7,
                #D1A6F1
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: #98CAF7;
            min-height: 40px;
        }

        .quantity {
            font-size: 25px;
            font-weight: bold;
            margin: 15px 0;
            color: #7ACAED;
        }

        .low {
            color: #D1A6F1;
        }

        .price {
            color: #C78BE4;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 9px 12px;
        }

        .empty {
            text-align: center;
            padding: 50px;
            border: 1px dashed rgba(122, 202, 237, 0.35);
            border-radius: 15px;
            color: #98CAF7;
            grid-column: 1 / -1;
            background: rgba(12, 27, 44, 0.55);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 15, 0.78);
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(
                145deg,
                #0c1b2c,
                #15152a
            );
            border: 1px solid rgba(199, 139, 228, 0.35);
            border-radius: 18px;
            padding: 25px;
            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(122, 202, 237, 0.08);
        }

        .modal-content h2 {
            margin-top: 0;
            background: linear-gradient(
                90deg,
                #7ACAED,
                #98CAF7,
                #C78BE4,
                #D1A6F1
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #98CAF7;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button:not(.primary) {
            background: rgba(152, 202, 247, 0.12);
            border: 1px solid rgba(152, 202, 247, 0.25);
            color: #98CAF7;
        }

        @media (max-width: 800px) {
            .stats,
            .products {
                grid-template-columns: 1fr;
            }

            .top,
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Neptune Legal</h1>
    <p>Gestion des stocks</p>
</header>

<div class="container">

    <a class="back" href="entreprise-dashboard.html">
        ← Retour au tableau de bord
    </a>

    <div class="top">
        <div>
            <h2>Stocks</h2>
            <p>Gérez les produits et les quantités de votre entreprise.</p>
        </div>

        <button class="primary" onclick="ouvrirModal()">
            Ajouter un produit
        </button>
    </div>

    <div class="stats">
        <div class="stat">
            <span>Produits</span>
            <strong id="totalProduits">0</strong>
        </div>

        <div class="stat">
            <span>Quantité totale</span>
            <strong id="quantiteTotale">0</strong>
        </div>

        <div class="stat">
            <span>Stock faible</span>
            <strong id="stockFaible">0</strong>
        </div>

        <div class="stat">
            <span>Valeur du stock</span>
            <strong id="valeurStock">0 €</strong>
        </div>
    </div>

    <div class="toolbar">
        <input
            type="text"
            id="recherche"
            placeholder="Rechercher un produit..."
            oninput="afficherProduits()"
        >

        <select id="filtre" onchange="afficherProduits()">
            <option value="tous">Tous</option>
            <option value="faible">Stock faible</option>
            <option value="normal">Stock normal</option>
        </select>
    </div>

    <div id="products" class="products">
        <div class="empty">
            Chargement des stocks...
        </div>
    </div>

</div>

<div id="modal" class="modal">

    <div class="modal-content">

        <h2>Ajouter un produit</h2>

        <div class="field">
            <label>Nom du produit</label>
            <input id="nom" type="text" placeholder="Ex : Eau">
        </div>

        <div class="field">
            <label>Description</label>
            <textarea
                id="description"
                placeholder="Description du produit"
            ></textarea>
        </div>

        <div class="field">
            <label>Quantité</label>
            <input id="quantite" type="number" min="0" value="0">
        </div>

        <div class="field">
            <label>Seuil d'alerte</label>
            <input id="seuil" type="number" min="0" value="5">
        </div>

        <div class="field">
            <label>Prix unitaire</label>
            <input id="prix" type="number" min="0" step="0.01" value="0">
        </div>

        <div class="modal-actions">
            <button class="primary" onclick="ajouterProduit()">
                Ajouter
            </button>

            <button onclick="fermerModal()">
                Annuler
            </button>
        </div>

    </div>

</div>

<script>
const SUPABASE_URL = "https://xzmglqxcsrzivvkpemyt.supabase.co";
const SUPABASE_KEY = "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let produits = [];

async function verifierConnexion() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) {
        window.location.href = "connexion.html";
        return false;
    }

    return true;
}

async function chargerProduits() {

    const connecte = await verifierConnexion();

    if (!connecte) return;

    const { data, error } =
        await supabaseClient
            .from("Stocks")
            .select("*")
            .order("created_at", { ascending: false });

    if (error) {

        console.error(error);

        document.getElementById("products").innerHTML = `
            <div class="empty">
                <strong>Erreur Supabase</strong><br><br>
                ${echapper(error.message)}
            </div>
        `;

        return;
    }

    produits = data || [];

    afficherProduits();
    mettreAJourStats();
}

function afficherProduits() {

    const container =
        document.getElementById("products");

    const recherche =
        document.getElementById("recherche")
            .value
            .toLowerCase()
            .trim();

    const filtre =
        document.getElementById("filtre").value;

    const resultat =
        produits.filter(produit => {

            const nom =
                (produit.nom || "").toLowerCase();

            const correspondRecherche =
                nom.includes(recherche);

            const faible =
                Number(produit.quantite) <=
                Number(produit.seuil_alerte);

            const correspondFiltre =
                filtre === "tous" ||
                (filtre === "faible" && faible) ||
                (filtre === "normal" && !faible);

            return correspondRecherche &&
                   correspondFiltre;
        });

    if (resultat.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Aucun produit trouvé.
            </div>
        `;

        return;
    }

    container.innerHTML =
        resultat.map(produit => {

            const quantite =
                Number(produit.quantite) || 0;

            const seuil =
                Number(produit.seuil_alerte) || 0;

            const prix =
                Number(produit.prix_unitaire) || 0;

            const faible =
                quantite <= seuil;

            return `
                <div class="product">

                    <h3>
                        ${echapper(produit.nom)}
                    </h3>

                    <div class="description">
                        ${echapper(
                            produit.description ||
                            "Aucune description"
                        )}
                    </div>

                    <div class="quantity ${faible ? "low" : ""}">
                        ${quantite} unités
                    </div>

                    <div>
                        Seuil : ${seuil}
                    </div>

                    <div class="price">
                        ${prix.toFixed(2)} € / unité
                    </div>

                    <div class="actions">

                        <button
                            class="primary"
                            onclick="modifierQuantite('${produit.id}', 1)"
                        >
                            +1
                        </button>

                        <button
                            onclick="modifierQuantite('${produit.id}', -1)"
                        >
                            -1
                        </button>

                        <button
                            class="danger"
                            onclick="supprimerProduit('${produit.id}')"
                        >
                            Supprimer
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}

function mettreAJourStats() {

    const totalProduits =
        produits.length;

    const quantiteTotale =
        produits.reduce(
            (total, produit) =>
                total +
                (Number(produit.quantite) || 0),
            0
        );

    const stockFaible =
        produits.filter(
            produit =>
                Number(produit.quantite) <=
                Number(produit.seuil_alerte)
        ).length;

    const valeurStock =
        produits.reduce(
            (total, produit) =>
                total +
                (
                    (Number(produit.quantite) || 0) *
                    (Number(produit.prix_unitaire) || 0)
                ),
            0
        );

    document.getElementById(
        "totalProduits"
    ).textContent = totalProduits;

    document.getElementById(
        "quantiteTotale"
    ).textContent = quantiteTotale;

    document.getElementById(
        "stockFaible"
    ).textContent = stockFaible;

    document.getElementById(
        "valeurStock"
    ).textContent =
        valeurStock.toFixed(2) + " €";
}

async function ajouterProduit() {

    const nom =
        document.getElementById("nom")
            .value
            .trim();

    const description =
        document.getElementById("description")
            .value
            .trim();

    const quantite =
        Number(
            document.getElementById("quantite").value
        );

    const seuil =
        Number(
            document.getElementById("seuil").value
        );

    const prix =
        Number(
            document.getElementById("prix").value
        );

    if (!nom) {
        alert("Entre le nom du produit.");
        return;
    }

    const { data: userData } =
        await supabaseClient.auth.getUser();

    if (!userData.user) {
        window.location.href = "connexion.html";
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("Stocks")
            .insert({
                nom: nom,
                description: description || null,
                quantite: quantite || 0,
                seuil_alerte: seuil || 5,
                prix_unitaire: prix || 0,
                entreprise_id: null
            })
            .select()
            .single();

    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        alert(
            "Erreur Supabase :\n\n" +
            error.message +
            "\n\nCode : " +
            (error.code || "inconnu")
        );

        return;
    }

    produits.unshift(data);

    fermerModal();

    document.getElementById("nom").value = "";
    document.getElementById("description").value = "";
    document.getElementById("quantite").value = "0";
    document.getElementById("seuil").value = "5";
    document.getElementById("prix").value = "0";

    afficherProduits();
    mettreAJourStats();
}

async function modifierQuantite(id, changement) {

    const produit =
        produits.find(
            produit => produit.id === id
        );

    if (!produit) return;

    const nouvelleQuantite =
        Math.max(
            0,
            Number(produit.quantite) +
            changement
        );

    const { data, error } =
        await supabaseClient
            .from("Stocks")
            .update({
                quantite: nouvelleQuantite
            })
            .eq("id", id)
            .select()
            .single();

    if (error) {

        alert(
            "Erreur Supabase :\n\n" +
            error.message
        );

        return;
    }

    const index =
        produits.findIndex(
            produit => produit.id === id
        );

    produits[index] = data;

    afficherProduits();
    mettreAJourStats();
}

async function supprimerProduit(id) {

    if (!confirm("Supprimer ce produit ?")) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("Stocks")
            .delete()
            .eq("id", id);

    if (error) {

        alert(
            "Erreur Supabase :\n\n" +
            error.message
        );

        return;
    }

    produits =
        produits.filter(
            produit => produit.id !== id
        );

    afficherProduits();
    mettreAJourStats();
}

function ouvrirModal() {
    document.getElementById("modal").style.display = "flex";
}

function fermerModal() {
    document.getElementById("modal").style.display = "none";
}

function echapper(texte) {

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

chargerProduits();
</script>

</body>
</html>
