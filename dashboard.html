<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neptune Legal — Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px 30px;
            background: #11182d;
            border-bottom: 1px solid #26304d;
        }

        header h1 {
            color: #7ACAED;
            font-size: 26px;
        }

        header p {
            color: #98CAF7;
            margin-top: 6px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .card {
            background: #11182d;
            border: 1px solid #26304d;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #7ACAED;
            margin-bottom: 18px;
        }

        .info {
            margin: 12px 0;
            color: #d8e4f5;
        }

        .value {
            color: #98CAF7;
            font-weight: bold;
        }

        .access {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(122, 202, 237, 0.10);
            border: 1px solid #7ACAED;
            color: #d8e4f5;
        }

        .error {
            background: rgba(220, 70, 70, 0.12);
            border: 1px solid #dc4646;
            color: #ff8585;
        }

        .loading {
            color: #98CAF7;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #080c17;
            color: #b9c8df;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>Neptune Legal</h1>
    <p>Tableau de bord</p>
</header>

<main>

    <div class="card">
        <h2>Connexion</h2>

        <div id="connexion" class="loading">
            Vérification de la connexion...
        </div>
    </div>


    <div class="card">
        <h2>Profil Discord</h2>

        <div class="info">
            Discord :
            <span id="discordName" class="value">
                Chargement...
            </span>
        </div>

        <div class="info">
            ID Discord :
            <span id="discordId" class="value">
                Chargement...
            </span>
        </div>

        <div class="info">
            Rôle Neptune Legal :
            <span id="discordRole" class="value">
                Chargement...
            </span>
        </div>

        <div id="accessBox" class="access">
            Vérification des permissions...
        </div>
    </div>


    <div class="card">
        <h2>Diagnostic</h2>

        <pre id="diagnostic">Chargement...</pre>
    </div>

</main>


<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://xzmglqxcsrzivvkpemyt.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       EDGE FUNCTION
    ========================= */

    const FUNCTION_NAME =
        "R-les_discord";

    const FUNCTION_URL =
        SUPABASE_URL +
        "/functions/v1/" +
        FUNCTION_NAME;


    /* =========================
       DIAGNOSTIC
    ========================= */

    function diagnostic(message) {

        console.log(message);

        const box =
            document.getElementById("diagnostic");

        box.textContent +=
            message + "\n";
    }


    /* =========================
       DASHBOARD
    ========================= */

    async function chargerDashboard() {

        try {

            document.getElementById(
                "diagnostic"
            ).textContent = "";


            diagnostic(
                "ÉTAPE 1 : récupération de la session..."
            );


            /* SESSION */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (sessionError) {

                throw new Error(
                    "Erreur session : " +
                    sessionError.message
                );

            }


            const session =
                sessionData.session;


            if (!session) {

                document.getElementById(
                    "connexion"
                ).textContent =
                    "Vous n'êtes pas connecté.";


                diagnostic(
                    "Aucune session Supabase trouvée."
                );


                return;
            }


            diagnostic(
                "ÉTAPE 2 : session Supabase trouvée."
            );


            const user =
                session.user;


            document.getElementById(
                "connexion"
            ).textContent =
                "Connecté";


            /* =========================
               IDENTITÉ DISCORD
            ========================= */

            diagnostic(
                "ÉTAPE 3 : recherche de l'identifiant Discord..."
            );


            const discordIdentity =
                user.identities?.find(
                    identity =>
                        identity.provider === "discord"
                );


            const discordUserId =
                discordIdentity?.identity_data?.provider_id ||
                discordIdentity?.identity_data?.sub ||
                user.user_metadata?.provider_id ||
                user.user_metadata?.sub;


            if (!discordUserId) {

                document.getElementById(
                    "discordId"
                ).textContent =
                    "Introuvable";


                document.getElementById(
                    "discordRole"
                ).textContent =
                    "Aucun accès";


                document.getElementById(
                    "accessBox"
                ).textContent =
                    "Impossible de récupérer votre identifiant Discord.";


                document.getElementById(
                    "accessBox"
                ).classList.add("error");


                diagnostic(
                    "ERREUR : identifiant Discord introuvable."
                );


                return;
            }


            diagnostic(
                "ÉTAPE 4 : Discord ID trouvé."
            );


            document.getElementById(
                "discordId"
            ).textContent =
                discordUserId;


            /* =========================
               NOM DISCORD
            ========================= */

            const discordName =
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.user_metadata?.user_name ||
                user.user_metadata?.preferred_username ||
                "Utilisateur Discord";


            document.getElementById(
                "discordName"
            ).textContent =
                discordName;


            /* =========================
               APPEL EDGE FUNCTION
            ========================= */

            diagnostic(
                "ÉTAPE 5 : appel de R-les_discord..."
            );


            console.log(
                "URL fonction :",
                FUNCTION_URL
            );


            const {
                data: roleData,
                error: functionError
            } =
                await supabaseClient.functions.invoke(
                    FUNCTION_NAME,
                    {
                        body: {
                            discord_user_id:
                                discordUserId
                        }
                    }
                );


            if (functionError) {

                console.error(
                    "Erreur Edge Function :",
                    functionError
                );


                throw new Error(
                    "Impossible de contacter la fonction Supabase : " +
                    functionError.message
                );

            }


            if (!roleData) {

                throw new Error(
                    "La fonction n'a retourné aucune donnée."
                );

            }


            diagnostic(
                "ÉTAPE 6 : réponse de R-les_discord reçue."
            );


            console.log(
                "Réponse :",
                roleData
            );


            /* =========================
               ERREUR RETOURNÉE
            ========================= */

            if (roleData.error) {

                throw new Error(
                    roleData.error
                );

            }


            /* =========================
               RÔLE
            ========================= */

            const role =
                roleData.role ||
                "Aucun accès";


            const fullAccess =
                roleData.full_access === true;


            document.getElementById(
                "discordRole"
            ).textContent =
                role;


            /* =========================
               PERMISSIONS
            ========================= */

            const accessBox =
                document.getElementById(
                    "accessBox"
                );


            accessBox.classList.remove(
                "error"
            );


            if (roleData.member === false) {

                accessBox.textContent =
                    "Vous n'êtes pas membre du serveur Discord Neptune.";

                accessBox.classList.add(
                    "error"
                );

            }

            else if (fullAccess) {

                accessBox.textContent =
                    "Accès complet autorisé — rôle : " +
                    role;

            }

            else if (role === "Citoyens") {

                accessBox.textContent =
                    "Accès citoyen autorisé.";

            }

            else {

                accessBox.textContent =
                    "Aucun accès administrateur.";

                accessBox.classList.add(
                    "error"
                );

            }


            /* =========================
               LOCAL STORAGE
            ========================= */

            localStorage.setItem(
                "neptune_role",
                role
            );


            localStorage.setItem(
                "neptune_full_access",
                String(fullAccess)
            );


            localStorage.setItem(
                "neptune_discord_user_id",
                discordUserId
            );


            diagnostic(
                "ÉTAPE 7 : permissions enregistrées."
            );


            diagnostic(
                "Connexion Neptune Legal réussie."
            );


        }

        catch (error) {

            console.error(
                "Erreur dashboard :",
                error
            );


            document.getElementById(
                "connexion"
            ).textContent =
                "Erreur de connexion";


            const accessBox =
                document.getElementById(
                    "accessBox"
                );


            accessBox.textContent =
                "Une erreur est survenue pendant la vérification des permissions.";


            accessBox.classList.add(
                "error"
            );


            diagnostic(
                "ERREUR : " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    /* =========================
       LANCEMENT
    ========================= */

    chargerDashboard();

</script>

</body>
</html>
