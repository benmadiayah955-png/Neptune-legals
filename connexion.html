<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neptune Legal - Connexion</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            background: #111722;
            border: 1px solid #252d3a;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        p {
            margin: 0 0 30px;
            color: #9da7b7;
        }

        .discord-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .discord-button:hover {
            background: #4752c4;
        }

        .discord-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #errorMessage {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #32191c;
            color: #ff8b8b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            src="logo.png"
            alt="Neptune Legal"
            class="logo"
        >

        <h1>Neptune Legal</h1>

        <p>
            Connecte-toi avec ton compte Discord
        </p>

        <button
            id="discordButton"
            class="discord-button"
            type="button"
        >
            <span id="buttonText">
                Continuer avec Discord
            </span>
        </button>

        <div id="errorMessage"></div>

    </div>


    <script>

        /* ==============================
           CONFIGURATION SUPABASE
        ============================== */

        const SUPABASE_URL =
            "https://xzmglqxcsrzivvkpemyt.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";


        /* ==============================
           INITIALISATION SUPABASE
        ============================== */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==============================
           ELEMENTS
        ============================== */

        const discordButton =
            document.getElementById("discordButton");

        const buttonText =
            document.getElementById("buttonText");

        const errorMessage =
            document.getElementById("errorMessage");


        /* ==============================
           AFFICHER UNE ERREUR
        ============================== */

        function afficherErreur(message) {

            errorMessage.textContent = message;

            errorMessage.style.display = "block";

            discordButton.disabled = false;

            buttonText.textContent =
                "Continuer avec Discord";
        }


        /* ==============================
           CONNEXION DISCORD
        ============================== */

        discordButton.addEventListener(
            "click",
            async function () {

                errorMessage.style.display = "none";

                discordButton.disabled = true;

                buttonText.textContent =
                    "Connexion en cours...";

                try {

                    const { data, error } =
                        await supabaseClient.auth.signInWithOAuth({

                            provider: "discord",

                            options: {

                                redirectTo:
                                    "https://benmadiayah955-png.github.io/Neptune-legals/dashboard.html"

                            }

                        });


                    if (error) {

                        console.error(
                            "Erreur Supabase :",
                            error
                        );

                        afficherErreur(
                            error.message
                        );

                        return;
                    }

                } catch (error) {

                    console.error(
                        "Erreur :",
                        error
                    );

                    afficherErreur(
                        "Impossible de lancer la connexion Discord."
                    );
                }

            }
        );

    </script>

</body>
</html>https://xzmglqxcsrzivvkpemyt.supabase.co/auth/v1/callback
