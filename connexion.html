<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neptune Legal — Connexion</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #080b12;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: #111722;
            border: 1px solid #252d3a;
            border-radius: 18px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9da7b7;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .discord-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .discord-button:hover {
            background: #4752c4;
        }

        .discord-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #errorMessage {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 70, 70, 0.12);
            border: 1px solid rgba(255, 70, 70, 0.3);
            color: #ff8585;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <img
                src="logo.png"
                alt="Neptune Legal"
                class="logo"
            >

            <h1>Neptune Legal</h1>

            <p class="subtitle">
                Connecte-toi avec ton compte Discord
            </p>

            <button
                id="discordButton"
                class="discord-button"
                type="button"
                onclick="connexionDiscord()"
            >
                <span id="buttonText">
                    Continuer avec Discord
                </span>
            </button>

            <div id="errorMessage"></div>

        </div>
    </div>

    <script>
        const SUPABASE_URL =
            "https://xzmglqxcsrzivvkpemyt.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        function afficherErreur(message) {
            const errorMessage =
                document.getElementById("errorMessage");

            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        async function connexionDiscord() {

            const button =
                document.getElementById("discordButton");

            const buttonText =
                document.getElementById("buttonText");

            button.disabled = true;
            buttonText.textContent =
                "Connexion en cours...";

            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithOAuth({

                        provider: "discord",

                        options: {
                            redirectTo:
                                window.location.origin +
                                "/Neptune-legals/dashboard.html"
                        }

                    });

                if (error) {

                    console.error(
                        "Erreur Supabase :",
                        error
                    );

                    afficherErreur(
                        "Impossible de lancer la connexion Discord. Vérifie la configuration Supabase."
                    );

                    button.disabled = false;

                    buttonText.textContent =
                        "Continuer avec Discord";

                    return;
                }

            } catch (error) {

                console.error(error);

                afficherErreur(
                    "Une erreur est survenue pendant la connexion."
                );

                button.disabled = false;

                buttonText.textContent =
                    "Continuer avec Discord";
            }
        }
    </script>

</body>
</html>
