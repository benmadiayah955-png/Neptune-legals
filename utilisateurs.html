<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Utilisateurs — Neptune Legal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 35px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            color: #737b8c;
            margin-top: 5px;
        }

        main {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .stat span {
            display: block;
            color: #737b8c;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat strong {
            font-size: 28px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input,
        select {
            background: white;
            border: 1px solid #dfe3ea;
            border-radius: 10px;
            padding: 13px 15px;
            font-size: 14px;
            outline: none;
        }

        input {
            flex: 1;
        }

        input:focus,
        select:focus {
            border-color: #5967ff;
        }

        .liste {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .user-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #eef0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #5967ff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            min-width: 0;
        }

        .user-info strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .user-info span {
            display: block;
            color: #737b8c;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.actif {
            background: #e8f8ef;
            color: #16834d;
        }

        .badge.suspendu {
            background: #fdeaea;
            color: #c62828;
        }

        .badge.attente {
            background: #fff5dc;
            color: #a56b00;
        }

        button {
            border: none;
            background: #172033;
            color: white;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            color: #737b8c;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .toolbar {
                flex-direction: column;
            }

            .user {
                align-items: flex-start;
                flex-direction: column;
            }

            .user-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Gestion des utilisateurs</h1>
    <p>Gérez les comptes, accès, entreprises et statuts des utilisateurs de Neptune Legal.</p>
</header>

<main>

    <section class="stats">

        <div class="stat">
            <span>Total utilisateurs</span>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <span>Actifs</span>
            <strong id="actifs">0</strong>
        </div>

        <div class="stat">
            <span>Sans entreprise</span>
            <strong id="sansEntreprise">0</strong>
        </div>

        <div class="stat">
            <span>Suspendus</span>
            <strong id="suspendus">0</strong>
        </div>

    </section>

    <section class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Rechercher un utilisateur..."
        >

        <select id="statut">
            <option value="tous">Tous les statuts</option>
            <option value="actif">Actif</option>
            <option value="suspendu">Suspendu</option>
            <option value="attente">En attente</option>
        </select>

    </section>

    <section id="liste" class="liste">

        <div class="message">
            Chargement des utilisateurs...
        </div>

    </section>

</main>

<script>

    const SUPABASE_URL =
        "https://xzmglqxcsrzivvkpemyt.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    let utilisateurs = [];


    async function chargerUtilisateurs() {

        const liste =
            document.getElementById("liste");

        liste.innerHTML =
            '<div class="message">Chargement des utilisateurs...</div>';

        const {
            data: {
                user
            }
        } =
        await supabaseClient.auth.getUser();


        if (!user) {

            window.location.href =
                "connexion.html";

            return;
        }


        const {
            data,
            error
        } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error(error);

            liste.innerHTML = `
                <div class="message">
                    Impossible de charger les utilisateurs.
                    <br><br>
                    Vérifie que la table <strong>profiles</strong>
                    existe et qu'elle autorise la lecture.
                </div>
            `;

            return;
        }


        utilisateurs =
            data || [];


        mettreAJourStatistiques();

        afficherUtilisateurs();

    }


    function mettreAJourStatistiques() {

        const total =
            utilisateurs.length;


        const actifs =
            utilisateurs.filter(function(user) {

                return (
                    user.status === "actif"
                    ||
                    user.status === "active"
                );

            }).length;


        const suspendus =
            utilisateurs.filter(function(user) {

                return user.status === "suspendu";

            }).length;


        const sansEntreprise =
            utilisateurs.filter(function(user) {

                return (
                    !user.company_id
                    &&
                    !user.entreprise_id
                );

            }).length;


        document.getElementById("total").textContent =
            total;

        document.getElementById("actifs").textContent =
            actifs;

        document.getElementById("suspendus").textContent =
            suspendus;

        document.getElementById("sansEntreprise").textContent =
            sansEntreprise;

    }


    function afficherUtilisateurs() {

        const recherche =
            document
                .getElementById("search")
                .value
                .toLowerCase()
                .trim();


        const statut =
            document.getElementById("statut").value;


        const resultat =
            utilisateurs.filter(function(user) {

                const nom =
                    user.full_name
                    ||
                    user.username
                    ||
                    user.name
                    ||
                    "Utilisateur";


                const discord =
                    user.discord_username
                    ||
                    user.discord_id
                    ||
                    "";


                const texte =
                    (
                        nom
                        +
                        " "
                        +
                        discord
                    )
                    .toLowerCase();


                const rechercheOK =
                    texte.includes(recherche);


                const statutUtilisateur =
                    normaliserStatut(
                        user.status
                    );


                const statutOK =
                    statut === "tous"
                    ||
                    statutUtilisateur === statut;


                return rechercheOK && statutOK;

            });


        const liste =
            document.getElementById("liste");


        if (resultat.length === 0) {

            liste.innerHTML = `
                <div class="message">
                    Aucun utilisateur trouvé.
                </div>
            `;

            return;
        }


        liste.innerHTML =
            resultat
                .map(creerUtilisateurHTML)
                .join("");

    }


    function normaliserStatut(status) {

        if (!status) {
            return "actif";
        }


        const valeur =
            String(status).toLowerCase();


        if (
            valeur === "suspendu"
            ||
            valeur === "suspended"
        ) {
            return "suspendu";
        }


        if (
            valeur === "attente"
            ||
            valeur === "pending"
        ) {
            return "attente";
        }


        return "actif";

    }


    function creerUtilisateurHTML(user) {

        const nom =
            user.full_name
            ||
            user.username
            ||
            user.name
            ||
            "Utilisateur";


        const discord =
            user.discord_username
            ||
            user.discord_id
            ||
            "Discord non renseigné";


        const entreprise =
            user.company_name
            ||
            user.entreprise
            ||
            "Sans entreprise";


        const statut =
            normaliserStatut(
                user.status
            );


        let statutTexte =
            "Actif";


        if (statut === "suspendu") {
            statutTexte = "Suspendu";
        }

        if (statut === "attente") {
            statutTexte = "En attente";
        }


        const avatar =
            user.avatar_url
            ||
            user.avatar
            ||
            "";


        const initiale =
            nom
                .charAt(0)
                .toUpperCase();


        return `
            <div class="user">

                <div class="user-left">

                    <div class="avatar">

                        ${
                            avatar
                            ?
                            `<img src="${avatar}" alt="">`
                            :
                            initiale
                        }

                    </div>

                    <div class="user-info">

                        <strong>
                            ${echapper(nom)}
                        </strong>

                        <span>
                            Discord : ${echapper(discord)}
                            •
                            ${echapper(entreprise)}
                        </span>

                    </div>

                </div>


                <div class="user-right">

                    <span class="badge ${statut}">
                        ${statutTexte}
                    </span>

                    <button
                        onclick="ouvrirProfil('${user.id}')"
                    >
                        Profil
                    </button>

                </div>

            </div>
        `;

    }


    function echapper(texte) {

        return String(texte)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function ouvrirProfil(id) {

        window.location.href =
            "profil-utilisateur.html?id="
            +
            encodeURIComponent(id);

    }


    document
        .getElementById("search")
        .addEventListener(
            "input",
            afficherUtilisateurs
        );


    document
        .getElementById("statut")
        .addEventListener(
            "change",
            afficherUtilisateurs
        );


    chargerUtilisateurs();

</script>

</body>
</html>
