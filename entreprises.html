<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neptune Legal — Candidature</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(199,139,228,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at top left,
            rgba(122,202,237,.12),
            transparent 30%
        ),
        #0b1020;

    color: white;
    min-height: 100vh;
}


/* HEADER */

header {
    background: rgba(17,24,45,.96);
    border-bottom: 1px solid #26304d;
    padding: 20px 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #7ACAED,
        #58A3DD,
        #C78BE4,
        #D1A6F1
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.retour {
    text-decoration: none;
    color: #98CAF7;
    font-weight: bold;

    padding: 9px 14px;
    border: 1px solid #26304d;
    border-radius: 10px;

    transition: .2s;
}

.retour:hover {
    color: #7ACAED;
    border-color: #7ACAED;
    background: rgba(122,202,237,.08);
}


/* MAIN */

main {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 40px 20px 60px;
}

.titre {
    margin-bottom: 25px;
}

.titre h1 {
    margin-bottom: 8px;
    font-size: 32px;
    color: #7ACAED;
}

.titre p {
    color: #98a9c4;
}


/* CARD */

.card {
    background:
        linear-gradient(
            145deg,
            #11182d,
            #0e1426
        );

    border: 1px solid #26304d;
    border-radius: 20px;

    padding: 30px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}


/* CONNEXION */

.connexion {
    padding: 14px 16px;
    margin-bottom: 25px;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            rgba(122,202,237,.08),
            rgba(199,139,228,.08)
        );

    border: 1px solid rgba(122,202,237,.25);

    color: #98a9c4;
    font-size: 14px;
}

.connexion strong {
    color: #7ACAED;
}


/* CHAMPS */

.champ {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: bold;

    color: #d8e4f5;
}

input,
select,
textarea {
    width: 100%;

    border: 1px solid #26304d;
    border-radius: 12px;

    padding: 14px;

    font-size: 14px;

    color: #d8e4f5;

    background: #0b1020;

    outline: none;
}

input::placeholder,
textarea::placeholder {
    color: #64748b;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #7ACAED;

    box-shadow:
        0 0 0 3px rgba(88,163,221,.12);
}

select option {
    background: #11182d;
    color: white;
}

textarea {
    min-height: 170px;
    resize: vertical;
}

.info {
    margin-top: 7px;

    color: #71819b;
    font-size: 12px;
}


/* BOUTON */

.bouton {
    width: 100%;

    border: none;
    border-radius: 12px;

    padding: 15px;

    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #58A3DD,
            #C78BE4
        );

    transition: .2s;
}

.bouton:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(88,163,221,.20);
}

.bouton:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}


/* MESSAGES */

.message {
    display: none;

    margin-top: 18px;

    padding: 15px;

    border-radius: 12px;

    font-size: 14px;
    line-height: 1.5;
}

.success {
    display: block;

    background: rgba(70,190,120,.10);
    color: #8ff0b5;

    border: 1px solid rgba(70,190,120,.40);
}

.error {
    display: block;

    background: rgba(220,70,70,.10);
    color: #ff8585;

    border: 1px solid rgba(220,70,70,.40);
}

.loading {
    display: block;

    background: rgba(122,202,237,.10);
    color: #98CAF7;

    border: 1px solid rgba(122,202,237,.35);
}


/* MOBILE */

@media (max-width:650px) {

    header {
        padding: 16px;
    }

    main {
        padding: 25px 15px 40px;
    }

    .card {
        padding: 20px;
    }

    .titre h1 {
        font-size: 27px;
    }
}
</style>
</head>


<body>

<header>

    <div class="logo">
        Neptune Legal
    </div>

    <a
        href="entreprises.html"
        class="retour"
    >
        Retour
    </a>

</header>


<main>

    <div class="titre">

        <h1>
            Déposer une candidature
        </h1>

        <p>
            Rejoignez une entreprise en déposant votre candidature.
        </p>

    </div>


    <div class="card">

        <div
            id="connexionInfo"
            class="connexion"
        >
            Vérification de votre connexion...
        </div>


        <div class="champ">

            <label for="entreprise">
                Entreprise
            </label>

            <select id="entreprise">

                <option value="">
                    Chargement des entreprises...
                </option>

            </select>

        </div>


        <div class="champ">

            <label for="nom">
                Nom
            </label>

            <input
                id="nom"
                type="text"
                placeholder="Votre nom"
            >

        </div>


        <div class="champ">

            <label for="motivation">
                Motivation
            </label>

            <textarea
                id="motivation"
                placeholder="Expliquez votre motivation..."
            ></textarea>

        </div>


        <div class="champ">

            <label for="document">
                Document
            </label>

            <input
                id="document"
                type="file"
            >

            <div class="info">
                Le document est sélectionné sur votre appareil mais n'est pas envoyé à Supabase.
            </div>

        </div>


        <button
            id="submitBtn"
            class="bouton"
            type="button"
        >
            Déposer ma candidature
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</main>


<script>

const SUPABASE_URL =
    "https://xzmglqxcsrzivvkpemyt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let utilisateur = null;


/* ================================
   MESSAGE
================================ */

function message(texte, type) {

    const element =
        document.getElementById("message");

    element.textContent = texte;

    element.className =
        "message " + type;
}


/* ================================
   CONNEXION
================================ */

async function verifierConnexion() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if (error || !data.user) {

        window.location.href =
            "connexion.html";

        return false;
    }


    utilisateur =
        data.user;


    const metadata =
        utilisateur.user_metadata || {};


    const nom =
        metadata.full_name ||
        metadata.name ||
        metadata.preferred_username ||
        "";


    document.getElementById(
        "nom"
    ).value = nom;


    document.getElementById(
        "connexionInfo"
    ).innerHTML =
        `
        Connecté en tant que
        <strong>
            ${escapeHTML(
                nom ||
                utilisateur.email ||
                "Utilisateur"
            )}
        </strong>
        `;


    return true;
}


/* ================================
   ENTREPRISES
================================ */

async function chargerEntreprises() {

    const select =
        document.getElementById(
            "entreprise"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("Entreprises")
        .select("id, Nom")
        .order("Nom", {
            ascending: true
        });


    if (error) {

        console.error(
            "Erreur Entreprises :",
            error
        );


        select.innerHTML =
            `
            <option value="">
                Erreur lors du chargement
            </option>
            `;


        message(
            "Impossible de charger les entreprises : " +
            error.message,
            "error"
        );


        return;
    }


    if (!data || data.length === 0) {

        select.innerHTML =
            `
            <option value="">
                Aucune entreprise disponible
            </option>
            `;


        message(
            "Aucune entreprise n'a été trouvée dans Supabase.",
            "error"
        );


        return;
    }


    select.innerHTML =
        `
        <option value="">
            Sélectionner une entreprise
        </option>
        `;


    data.forEach(
        entreprise => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                entreprise.id;


            option.textContent =
                entreprise.Nom;


            select.appendChild(
                option
            );

        }
    );
}


/* ================================
   ENVOYER CANDIDATURE
================================ */

async function envoyerCandidature() {

    if (!utilisateur) {

        message(
            "Vous devez être connecté.",
            "error"
        );

        return;
    }


    const entrepriseId =
        document.getElementById(
            "entreprise"
        ).value;


    const nom =
        document.getElementById(
            "nom"
        ).value.trim();


    const motivation =
        document.getElementById(
            "motivation"
        ).value.trim();


    const fichier =
        document.getElementById(
            "document"
        ).files[0];


    if (!entrepriseId) {

        message(
            "Sélectionnez une entreprise.",
            "error"
        );

        return;
    }


    if (!nom) {

        message(
            "Indiquez votre nom.",
            "error"
        );

        return;
    }


    if (!motivation) {

        message(
            "Indiquez votre motivation.",
            "error"
        );

        return;
    }


    const bouton =
        document.getElementById(
            "submitBtn"
        );


    bouton.disabled = true;

    bouton.textContent =
        "Envoi en cours...";


    const {
        error
    } =
    await supabaseClient
        .from("candidatures")
        .insert({

            entreprise_id:
                entrepriseId,

            nom:
                nom,

            motivation:
                motivation,

            statut:
                "en_attente"

        });


    if (error) {

        console.error(
            "Erreur candidature :",
            error
        );


        message(
            "Erreur lors de l'envoi : " +
            error.message,
            "error"
        );


        bouton.disabled = false;

        bouton.textContent =
            "Déposer ma candidature";

        return;
    }


    message(
        "Votre candidature a été envoyée avec succès. Elle est maintenant en attente de traitement par le Staff.",
        "success"
    );


    document.getElementById(
        "entreprise"
    ).value = "";


    document.getElementById(
        "motivation"
    ).value = "";


    document.getElementById(
        "document"
    ).value = "";


    bouton.disabled = false;

    bouton.textContent =
        "Déposer ma candidature";
}


/* ================================
   PROTECTION HTML
================================ */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================================
   LANCEMENT
================================ */

async function initialiser() {

    const connecte =
        await verifierConnexion();


    if (!connecte) {
        return;
    }


    await chargerEntreprises();


    document
        .getElementById("submitBtn")
        .addEventListener(
            "click",
            envoyerCandidature
        );
}


initialiser();

</script>

</body>
</html>
