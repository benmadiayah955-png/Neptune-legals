<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neptune Legal — Candidature</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bleu: #7ACAED;
            --bleu-fonce: #58A3DD;
            --bleu-clair: #98CAF7;
            --violet: #C78BE4;
            --violet-clair: #D1A6F1;

            --fond: #0b1020;
            --fond-secondaire: #11182d;
            --fond-tertiaire: #0e1426;
            --texte: #ffffff;
            --texte-secondaire: #aebbd0;
            --bordure: #26304d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(199, 139, 228, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at top left,
                    rgba(122, 202, 237, 0.12),
                    transparent 30%
                ),
                #0b1020;

            color: var(--texte);
            min-height: 100vh;
        }

        header {
            background: rgba(17, 24, 45, 0.96);
            border-bottom: 1px solid var(--bordure);

            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 10;

            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                var(--bleu),
                var(--bleu-fonce),
                var(--violet),
                var(--violet-clair)
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .retour {
            text-decoration: none;
            color: var(--bleu-clair);
            font-weight: bold;

            padding: 9px 14px;
            border-radius: 10px;

            transition: 0.2s;
        }

        .retour:hover {
            background: rgba(122, 202, 237, 0.10);
            color: white;
        }

        main {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 40px 20px;
        }

        .titre {
            margin-bottom: 25px;
        }

        .titre h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .titre p {
            margin: 0;
            color: var(--texte-secondaire);
        }

        .card {
            background:
                linear-gradient(
                    145deg,
                    #11182d,
                    #0e1426
                );

            border: 1px solid var(--bordure);
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .connexion {
            padding: 14px 16px;
            margin-bottom: 25px;

            border-radius: 12px;

            background: linear-gradient(
                90deg,
                rgba(122, 202, 237, 0.10),
                rgba(199, 139, 228, 0.10)
            );

            border: 1px solid var(--bordure);

            color: var(--texte-secondaire);
            font-size: 14px;
        }

        .connexion strong {
            color: white;
        }

        .champ {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
            color: #e7edf7;
        }

        input,
        select,
        textarea {
            width: 100%;

            border: 1px solid var(--bordure);
            border-radius: 12px;

            padding: 14px;

            font-size: 14px;

            color: #d8e4f5;
            background: #0b1020;

            outline: none;

            transition: 0.2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #66758e;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--bleu-fonce);

            box-shadow:
                0 0 0 3px rgba(88, 163, 221, 0.12);
        }

        select option {
            background: #0b1020;
            color: white;
        }

        textarea {
            min-height: 170px;
            resize: vertical;
        }

        .info {
            margin-top: 7px;

            color: #7888a2;
            font-size: 12px;
        }

        .bouton {
            width: 100%;

            border: none;
            border-radius: 12px;

            padding: 15px;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                var(--bleu-fonce),
                var(--violet)
            );

            transition: 0.2s;
        }

        .bouton:hover {
            opacity: 0.92;

            transform: translateY(-1px);
        }

        .bouton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 15px;

            border-radius: 12px;

            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            display: block;

            background: rgba(46, 204, 113, 0.10);
            color: #8be0ad;

            border: 1px solid rgba(46, 204, 113, 0.25);
        }

        .error {
            display: block;

            background: rgba(231, 76, 60, 0.10);
            color: #ff9c9c;

            border: 1px solid rgba(231, 76, 60, 0.25);
        }

        .loading {
            display: block;

            background: rgba(122, 202, 237, 0.10);
            color: var(--bleu-clair);

            border: 1px solid rgba(122, 202, 237, 0.25);
        }

        @media (max-width: 650px) {

            header {
                padding: 16px;
            }

            main {
                padding: 25px 15px;
            }

            .card {
                padding: 20px;
            }

            .titre h1 {
                font-size: 27px;
            }

            .logo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Neptune Legal
    </div>

    <a
        href="entreprises.html"
        class="retour"
    >
        Retour
    </a>

</header>


<main>

    <div class="titre">

        <h1>
            Déposer une candidature
        </h1>

        <p>
            Rejoignez une entreprise en déposant votre candidature.
        </p>

    </div>


    <div class="card">

        <div
            id="connexionInfo"
            class="connexion"
        >
            Vérification de votre connexion...
        </div>


        <div class="champ">

            <label for="entreprise">
                Entreprise
            </label>

            <select id="entreprise">

                <option value="">
                    Chargement des entreprises...
                </option>

            </select>

        </div>


        <div class="champ">

            <label for="nom">
                Nom
            </label>

            <input
                id="nom"
                type="text"
                placeholder="Votre nom"
            >

        </div>


        <div class="champ">

            <label for="motivation">
                Motivation
            </label>

            <textarea
                id="motivation"
                placeholder="Expliquez votre motivation..."
            ></textarea>

        </div>


        <div class="champ">

            <label for="document">
                Document
            </label>

            <input
                id="document"
                type="file"
            >

            <div class="info">
                Le fichier sélectionné n'est pas encore envoyé dans Supabase.
            </div>

        </div>


        <button
            id="submitBtn"
            class="bouton"
            type="button"
        >
            Déposer ma candidature
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</main>


<script>

const SUPABASE_URL =
    "https://xzmglqxcsrzivvkpemyt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UFCepbUJAZyIlUU3Z6OAOA_OQLTLYr1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let utilisateur = null;


/* ================================
   MESSAGE
================================ */

function message(
    texte,
    type
) {

    const element =
        document.getElementById("message");

    element.textContent = texte;

    element.className =
        "message " + type;
}


/* ================================
   CONNEXION
================================ */

async function verifierConnexion() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if (error || !data.user) {

        window.location.href =
            "connexion.html";

        return false;
    }


    utilisateur =
        data.user;


    const metadata =
        utilisateur.user_metadata || {};


    const nom =
        metadata.full_name ||
        metadata.name ||
        metadata.preferred_username ||
        "";


    document.getElementById(
        "nom"
    ).value = nom;


    document.getElementById(
        "connexionInfo"
    ).innerHTML =
        `
        Connecté en tant que
        <strong>
            ${escapeHTML(
                nom ||
                utilisateur.email ||
                "Utilisateur"
            )}
        </strong>
        `;


    return true;
}


/* ================================
   ENTREPRISES
================================ */

async function chargerEntreprises() {

    const select =
        document.getElementById(
            "entreprise"
        );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("Entreprises")
            .select("id, Nom")
            .order("Nom", {
                ascending: true
            });


    if (error) {

        console.error(
            "Erreur Entreprises :",
            error
        );


        select.innerHTML =
            `
            <option value="">
                Erreur lors du chargement
            </option>
            `;


        message(
            "Impossible de charger les entreprises : " +
            error.message,
            "error"
        );


        return;
    }


    if (!data || data.length === 0) {

        select.innerHTML =
            `
            <option value="">
                Aucune entreprise disponible
            </option>
            `;


        message(
            "Aucune entreprise n'a été trouvée dans Supabase.",
            "error"
        );


        return;
    }


    select.innerHTML =
        `
        <option value="">
            Sélectionner une entreprise
        </option>
        `;


    data.forEach(
        entreprise => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                entreprise.id;


            option.textContent =
                entreprise.Nom;


            select.appendChild(
                option
            );

        }
    );
}


/* ================================
   ENVOYER
================================ */

async function envoyerCandidature() {

    if (!utilisateur) {

        message(
            "Vous devez être connecté.",
            "error"
        );

        return;
    }


    const entrepriseId =
        document.getElementById(
            "entreprise"
        ).value;


    const nom =
        document.getElementById(
            "nom"
        ).value.trim();


    const motivation =
        document.getElementById(
            "motivation"
        ).value.trim();


    const fichier =
        document.getElementById(
            "document"
        ).files[0];


    if (!entrepriseId) {

        message(
            "Sélectionnez une entreprise.",
            "error"
        );

        return;
    }


    if (!nom) {

        message(
            "Indiquez votre nom.",
            "error"
        );

        return;
    }


    if (!motivation) {

        message(
            "Indiquez votre motivation.",
            "error"
        );

        return;
    }


    const bouton =
        document.getElementById(
            "submitBtn"
        );


    bouton.disabled = true;

    bouton.textContent =
        "Envoi en cours...";


    /*
       Le fichier est récupéré uniquement
       pour l'interface.

       Il n'est pas envoyé dans la table
       candidatures car cette table ne possède
       pas de colonne document.
    */

    const documentNom =
        fichier
            ? fichier.name
            : null;


    console.log(
        "Fichier sélectionné :",
        documentNom
    );


    const {
        error
    } =
        await supabaseClient
            .from("candidatures")
            .insert({

                entreprise_id:
                    entrepriseId,

                nom:
                    nom,

                motivation:
                    motivation,

                statut:
                    "en_attente"

            });


    if (error) {

        console.error(
            "Erreur candidature :",
            error
        );


        message(
            "Erreur lors de l'envoi : " +
            error.message,
            "error"
        );


        bouton.disabled = false;

        bouton.textContent =
            "Déposer ma candidature";

        return;
    }


    message(
        "Votre candidature a été envoyée avec succès. Elle est maintenant en attente de traitement par le Staff.",
        "success"
    );


    document.getElementById(
        "entreprise"
    ).value = "";


    document.getElementById(
        "motivation"
    ).value = "";


    document.getElementById(
        "document"
    ).value = "";


    bouton.disabled = false;

    bouton.textContent =
        "Déposer ma candidature";
}


/* ================================
   PROTECTION HTML
================================ */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* ================================
   LANCEMENT
================================ */

async function initialiser() {

    const connecte =
        await verifierConnexion();


    if (!connecte) {
        return;
    }


    await chargerEntreprises();


    document
        .getElementById("submitBtn")
        .addEventListener(
            "click",
            envoyerCandidature
        );
}


initialiser();

</script>

</body>
</html>
